services:
  app:
    build:
      context: .
      target: development
      args:
        NODE_VERSION: 24.22.0
    init: true
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      VITE_USE_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
